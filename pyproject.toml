[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biosignal-processing-reports"
version = "1.0.0"
description = "Advanced Biosignal and Voice Disorder Processing Reports and Algorithms"
readme = "README.md"
authors = [
    { name = "Aleksandr Demin", email = "alecsander2224@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
    "wfdb>=4.1.0"
]

[project.urls]
Homepage = "https://github.com/sanyanevsky"
Repository = "https://github.com/sanyanevsky/biosignal-processing-reports"
